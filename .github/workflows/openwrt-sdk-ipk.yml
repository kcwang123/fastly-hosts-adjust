name: OpenWrt 23.05.3 Filogic SDK IPK
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "openwrt/cdn-optimizer/**"
      - ".github/workflows/openwrt-sdk-ipk.yml"
      - "go-spike/**"
permissions:
  contents: read
concurrency:
  group: sdk-ipk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sdk-ipk:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-spike/go.mod
      - name: Produce static ARM64 candidate
        working-directory: go-spike
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm64
          GOARM64: v8.0
          GOPROXY: "off"
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go test ./cmd/fastly-public-health ./internal/probe ./internal/scanner
          go build -trimpath -ldflags="-s -w" -o "$RUNNER_TEMP/fastly-public-health" ./cmd/fastly-public-health
          sha256sum "$RUNNER_TEMP/fastly-public-health"
      - name: Download pinned official SDK
        env:
          SDK_SHA256: e51af2eff648e0f6ee8d8a918ed0973105a11daa9fe63e31eb52e315ca852fe5
        run: |
          set -eu
          sdk=openwrt-sdk-23.05.3-mediatek-filogic_gcc-12.3.0_musl.Linux-x86_64.tar.xz
          curl --fail --location --retry 2 --max-time 240 -o "$RUNNER_TEMP/$sdk" "https://downloads.openwrt.org/releases/23.05.3/targets/mediatek/filogic/$sdk"
          echo "$SDK_SHA256  $RUNNER_TEMP/$sdk" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/sdk"
          tar -xJf "$RUNNER_TEMP/$sdk" -C "$RUNNER_TEMP/sdk" --strip-components=1
      - name: Build and inspect IPK
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eux
          sdk="$RUNNER_TEMP/sdk"
          mkdir -p "$sdk/package/cdn-optimizer"
          cp -a openwrt/cdn-optimizer/. "$sdk/package/cdn-optimizer/"
          mkdir -p "$sdk/package/luci-app-cdn-optimizer"
          cp -a openwrt/luci-app-cdn-optimizer/. "$sdk/package/luci-app-cdn-optimizer/"
          cd "$sdk"
          make defconfig
          binary="$RUNNER_TEMP/fastly-public-health"
          digest="$(sha256sum "$binary" | cut -d' ' -f1)"
          make package/cdn-optimizer/compile -j2 V=s CDN_OPTIMIZER_BIN="$binary" CDN_OPTIMIZER_SHA256="$digest"
          make package/luci-app-cdn-optimizer/compile -j2 V=s CDN_OPTIMIZER_BIN="$binary" CDN_OPTIMIZER_SHA256="$digest"
          ipk="$(find bin/packages -type f -name 'cdn-optimizer_*.ipk' -print -quit)"
          test -n "$ipk"
          luci_ipk="$(find bin/packages -type f -name 'luci-app-cdn-optimizer_*.ipk' -print -quit)"
          test -n "$luci_ipk"
          mkdir -p "$RUNNER_TEMP/sdk-evidence"
          cp "$ipk" "$luci_ipk" "$RUNNER_TEMP/sdk-evidence/"
          cd "$RUNNER_TEMP/sdk-evidence"
          sha256sum "$(basename "$ipk")" "$(basename "$luci_ipk")" > SHA256SUMS
          actual="$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
          test "$actual" = "$SOURCE_HEAD_SHA"
          printf 'source_commit=%s\nsdk=23.05.3/mediatek/filogic\narch=aarch64_cortex-a53\n' "$actual" > BUILD-IDENTITY.txt
          mkdir -p unpack/control unpack/data
          tar -xzf "$(basename "$ipk")" -C unpack
          control="$(find unpack -name control.tar.gz -print -quit)"
          data="$(find unpack -name data.tar.gz -print -quit)"
          test -n "$control" && test -n "$data"
          tar -xzf "$control" -C unpack/control
          tar -xzf "$data" -C unpack/data
          test -f unpack/control/control
          grep -qx 'Architecture: aarch64_cortex-a53' unpack/control/control
          grep -qx 'Package: cdn-optimizer' unpack/control/control
          test -x unpack/data/usr/bin/fastly-public-health
          test -x unpack/data/usr/libexec/cdn-optimizer/run-once
          test -x unpack/data/usr/libexec/rpcd/cdn-optimizer
          test -f unpack/data/usr/share/rpcd/acl.d/luci-app-cdn-optimizer.json
          printf '%s\n' "$digest" > SOURCE-BINARY-SHA256.txt
          sha256sum unpack/data/usr/bin/fastly-public-health > PACKAGED-BINARY-SHA256.txt
          file unpack/data/usr/bin/fastly-public-health | grep -q 'ARM aarch64'
          file unpack/data/usr/bin/fastly-public-health | grep -q 'statically linked'
          find unpack/data -type f -printf '%P\n' | sort > IPK-CONTENTS.txt
          cp unpack/control/control IPK-CONTROL.txt
          file "$(basename "$ipk")" "$binary" > FILE-TYPES.txt
          cat SHA256SUMS BUILD-IDENTITY.txt FILE-TYPES.txt
          rm -rf unpack
      - uses: actions/upload-artifact@v4
        with:
          name: openwrt-filogic-sdk-ipk-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/sdk-evidence/
          retention-days: 7
