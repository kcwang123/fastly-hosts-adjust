name: Go ARM64 read-only spike
on:
  push:
    branches: [spike/go-arm64-readonly]
    paths: ["go-spike/**", ".github/workflows/go-arm64-spike.yml"]
  pull_request:
    paths: ["go-spike/**", ".github/workflows/go-arm64-spike.yml"]
permissions:
  contents: read
jobs:
  spike:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-spike/go.mod
      - name: Minimal offline unit tests
        working-directory: go-spike
        run: GOPROXY=off go test ./...
      - name: Host CLI RSS smoke (not ARM64 device measurement)
        working-directory: go-spike
        env:
          GOPROXY: "off"
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -ldflags="-s -w" -o /tmp/fastly-readonly-host ./cmd/fastly-readonly
          printf '{"dry_run":true,"auto_benchmark":false}\n' >/tmp/go-spike-safe.json
          /usr/bin/time -f 'host_peak_rss_kb=%M' /tmp/fastly-readonly-host --config /tmp/go-spike-safe.json
          printf '{"dry_run":false,"auto_benchmark":false}\n' >/tmp/go-spike-unsafe.json
          if /tmp/fastly-readonly-host --config /tmp/go-spike-unsafe.json; then
            echo 'FAIL: unsafe config accepted'; exit 1
          fi
      - name: Localhost TLS integration RSS (AMD64 test harness)
        working-directory: go-spike
        env:
          GOPROXY: "off"
          CGO_ENABLED: "0"
        run: |
          go test -c -o /tmp/fastly-local-health-test ./cmd/fastly-local-health
          /usr/bin/time -f 'amd64_local_tls_test_peak_rss_kb=%M' /tmp/fastly-local-health-test -test.run '^TestLocalHealthCLI
        working-directory: go-spike
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm64
          GOARM64: v8.0
          GOPROXY: "off"
        run: |
          go build -trimpath -ldflags="-s -w" -o /tmp/fastly-readonly-arm64 ./cmd/fastly-readonly
          file /tmp/fastly-readonly-arm64
          stat -c 'arm64_binary_bytes=%s' /tmp/fastly-readonly-arm64
          test "$(stat -c %s /tmp/fastly-readonly-arm64)" -lt 10485760
          go build -trimpath -ldflags="-s -w" -o /tmp/fastly-local-health-arm64 ./cmd/fastly-local-health
          file /tmp/fastly-local-health-arm64
          stat -c 'arm64_local_health_binary_bytes=%s' /tmp/fastly-local-health-arm64
          test "$(stat -c %s /tmp/fastly-local-health-arm64)" -lt 10485760
 -test.count=1
      - name: Cross-compile for Cortex-A53
        working-directory: go-spike
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm64
          GOARM64: v8.0
          GOPROXY: "off"
        run: |
          go build -trimpath -ldflags="-s -w" -o /tmp/fastly-readonly-arm64 ./cmd/fastly-readonly
          file /tmp/fastly-readonly-arm64
          stat -c 'arm64_binary_bytes=%s' /tmp/fastly-readonly-arm64
          test "$(stat -c %s /tmp/fastly-readonly-arm64)" -lt 10485760
          go build -trimpath -ldflags="-s -w" -o /tmp/fastly-local-health-arm64 ./cmd/fastly-local-health
          file /tmp/fastly-local-health-arm64
          stat -c 'arm64_local_health_binary_bytes=%s' /tmp/fastly-local-health-arm64
          test "$(stat -c %s /tmp/fastly-local-health-arm64)" -lt 10485760
