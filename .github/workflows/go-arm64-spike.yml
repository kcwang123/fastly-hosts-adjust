name: Go ARM64 read-only spike
on:
  push:
    branches: [spike/go-arm64-readonly]
    paths: ["go-spike/**", ".github/workflows/go-arm64-spike.yml"]
  pull_request:
    paths: ["go-spike/**", ".github/workflows/go-arm64-spike.yml"]
permissions:
  contents: read
jobs:
  spike:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-spike/go.mod
      - name: Minimal offline unit tests
        working-directory: go-spike
        run: GOPROXY=off go test ./...
      - name: Minimal race and concurrent state tests
        working-directory: go-spike
        run: GOPROXY=off go test -race ./cmd/fastly-local-health ./internal/scheduler ./internal/scanner
      - name: Host CLI RSS smoke (not ARM64 device measurement)
        working-directory: go-spike
        env:
          GOPROXY: "off"
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -ldflags="-s -w" -o /tmp/fastly-readonly-host ./cmd/fastly-readonly
          printf '{"dry_run":true,"auto_benchmark":false}\n' >/tmp/go-spike-safe.json
          /usr/bin/time -f 'host_peak_rss_kb=%M' /tmp/fastly-readonly-host --config /tmp/go-spike-safe.json
          printf '{"dry_run":false,"auto_benchmark":false}\n' >/tmp/go-spike-unsafe.json
          if /tmp/fastly-readonly-host --config /tmp/go-spike-unsafe.json; then
            echo 'FAIL: unsafe config accepted'; exit 1
          fi
      - name: Localhost TLS integration RSS (AMD64 test harness)
        working-directory: go-spike
        env:
          GOPROXY: "off"
          CGO_ENABLED: "0"
        run: |
          go test -c -o /tmp/fastly-local-health-test ./cmd/fastly-local-health
          /usr/bin/time -f 'amd64_local_tls_test_peak_rss_kb=%M' /tmp/fastly-local-health-test -test.run TestLocalHealthCLI -test.count=1
      - name: Cross-compile for Cortex-A53
        working-directory: go-spike
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm64
          GOARM64: v8.0
          GOPROXY: "off"
        run: |
          go build -trimpath -ldflags="-s -w" -o /tmp/fastly-readonly-arm64 ./cmd/fastly-readonly
          file /tmp/fastly-readonly-arm64
          stat -c 'arm64_binary_bytes=%s' /tmp/fastly-readonly-arm64
          test "$(stat -c %s /tmp/fastly-readonly-arm64)" -lt 10485760
          go build -trimpath -ldflags="-s -w" -o /tmp/fastly-local-health-arm64 ./cmd/fastly-local-health
          file /tmp/fastly-local-health-arm64
          stat -c 'arm64_local_health_binary_bytes=%s' /tmp/fastly-local-health-arm64
          test "$(stat -c %s /tmp/fastly-local-health-arm64)" -lt 10485760
          go build -trimpath -ldflags="-s -w" -o /tmp/fastly-public-health-arm64 ./cmd/fastly-public-health
          file /tmp/fastly-public-health-arm64
          test "$(stat -c %s /tmp/fastly-public-health-arm64)" -lt 10485760
      - name: Record immutable source and artifact checksums
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -eu
          mkdir -p /tmp/fastly-preflight
          cp /tmp/fastly-readonly-arm64 /tmp/fastly-local-health-arm64 /tmp/fastly-public-health-arm64 /tmp/fastly-preflight/
          cd /tmp/fastly-preflight
          sha256sum fastly-readonly-arm64 fastly-local-health-arm64 fastly-public-health-arm64 > SHA256SUMS
          printf "source_commit=%s\n" "$SOURCE_SHA" > BUILD-IDENTITY.txt
          go version >> BUILD-IDENTITY.txt
          printf "build_flags=CGO_ENABLED=0 GOOS=linux GOARCH=arm64 GOARM64=v8.0 -trimpath -ldflags=-s,-w\n" >> BUILD-IDENTITY.txt
          sha256sum -c SHA256SUMS
          cat SHA256SUMS BUILD-IDENTITY.txt
      - name: Upload offline-only ARM64 evidence
        uses: actions/upload-artifact@v4
        with:
          name: go-arm64-readonly-preflight-${{ github.sha }}
          path: |
            /tmp/fastly-preflight/fastly-readonly-arm64
            /tmp/fastly-preflight/fastly-local-health-arm64
            /tmp/fastly-preflight/fastly-public-health-arm64
            /tmp/fastly-preflight/SHA256SUMS
            /tmp/fastly-preflight/BUILD-IDENTITY.txt
          retention-days: 7
