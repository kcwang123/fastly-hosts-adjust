name: OpenWrt adapter tests
on:
  pull_request:
    paths:
      - "openwrt/**"
      - "tests/test_openwrt_*.py"
      - ".github/workflows/openwrt-tests.yml"
  push:
    branches: [main]
    paths:
      - "openwrt/**"
      - "tests/test_openwrt_*.py"
      - ".github/workflows/openwrt-tests.yml"
jobs:
  unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_openwrt_*.py' -v
      - run: python -m py_compile openwrt/adguard_plan.py openwrt/settings.py openwrt/scanner_export.py openwrt/runner.py openwrt/tls_verify.py openwrt/rewrite_tx.py openwrt/rewrite_recover.py openwrt/adguard_api.py openwrt/dryrun_pipeline.py openwrt/tx_safety.py openwrt/transaction_cli.py
      - run: sh -n openwrt/preflight.sh openwrt/run.sh
